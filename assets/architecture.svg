<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="raw-browser architecture">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#141518"/>
    </marker>
    <marker id="arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="440" fill="#efeee9"/>

  <!-- header -->
  <rect x="40" y="28" width="10" height="10" fill="#ff4d1c"/>
  <text x="58" y="38" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#6b6f76" letter-spacing="0.04em">raw-browser / architecture</text>
  <line x1="40" y1="50" x2="960" y2="50" stroke="#141518" stroke-width="2"/>

  <!-- caller -->
  <rect x="40" y="80" width="200" height="120" rx="2" fill="#fbfaf7" stroke="#141518" stroke-width="2"/>
  <text x="58" y="112" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#141518">Agent / script</text>
  <text x="58" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3e434b">one multi-step task</text>
  <text x="58" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3e434b">written as one script</text>
  <rect x="58" y="166" width="74" height="22" rx="2" fill="#efeee9" stroke="#141518" stroke-width="1.5"/>
  <text x="70" y="181" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#141518">raw run</text>
  <rect x="140" y="166" width="50" height="22" rx="2" fill="#efeee9" stroke="#141518" stroke-width="1.5"/>
  <text x="152" y="181" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#141518">MCP</text>

  <!-- runtime with selection marquee -->
  <rect x="300" y="80" width="240" height="120" rx="2" fill="#141518" stroke="#141518" stroke-width="2"/>
  <text x="320" y="112" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#fbfaf7">raw runtime</text>
  <text x="320" y="136" font-family="Consolas, monospace" font-size="11" fill="#c9c6bf">Node 22+ / zero npm deps</text>
  <text x="320" y="156" font-family="Consolas, monospace" font-size="11" fill="#c9c6bf">one script, one task</text>
  <text x="320" y="176" font-family="Consolas, monospace" font-size="11" fill="#c9c6bf">page.snapshot() / waits / downloads</text>
  <rect x="292" y="72" width="256" height="136" fill="none" stroke="#ff4d1c" stroke-width="3"/>
  <rect x="288" y="68" width="8" height="8" fill="#ff4d1c"/>
  <rect x="544" y="68" width="8" height="8" fill="#ff4d1c"/>
  <rect x="288" y="204" width="8" height="8" fill="#ff4d1c"/>
  <rect x="544" y="204" width="8" height="8" fill="#ff4d1c"/>

  <!-- browser -->
  <rect x="760" y="80" width="200" height="120" rx="2" fill="#fbfaf7" stroke="#141518" stroke-width="2"/>
  <text x="778" y="112" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#141518">Chrome / Edge</text>
  <text x="778" y="136" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3e434b">your real, signed-in</text>
  <text x="778" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3e434b">profile, tabs and cookies</text>
  <rect x="778" y="166" width="92" height="22" rx="2" fill="#ff4d1c" stroke="#141518" stroke-width="1.5"/>
  <text x="790" y="181" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#141518">no re-login</text>

  <!-- direct path -->
  <path d="M548 110 H760" fill="none" stroke="#ff4d1c" stroke-width="3" marker-end="url(#arrow-signal)"/>
  <text x="610" y="98" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#ff4d1c">CDP 9222</text>
  <text x="610" y="128" font-family="Consolas, monospace" font-size="9" fill="#6b6f76">direct</text>

  <!-- bridge path -->
  <path d="M420 208 V250 H620" fill="none" stroke="#141518" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow-ink)"/>
  <text x="470" y="240" font-family="Consolas, monospace" font-size="10" font-weight="600" fill="#ff4d1c">bridge 9333 / 9334</text>

  <rect x="620" y="212" width="150" height="76" rx="2" fill="#fbfaf7" stroke="#141518" stroke-width="2"/>
  <text x="636" y="238" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#141518">Native host</text>
  <text x="636" y="258" font-family="Consolas, monospace" font-size="10" fill="#3e434b">.NET 9 / stdio</text>
  <text x="636" y="276" font-family="Consolas, monospace" font-size="10" fill="#3e434b">127.0.0.1 + token</text>

  <path d="M770 250 H820" fill="none" stroke="#141518" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <rect x="820" y="212" width="140" height="76" rx="2" fill="#fbfaf7" stroke="#141518" stroke-width="2"/>
  <text x="836" y="238" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#141518">MV3 extension</text>
  <text x="836" y="258" font-family="Consolas, monospace" font-size="10" fill="#3e434b">chrome.debugger</text>
  <text x="836" y="276" font-family="Consolas, monospace" font-size="10" fill="#3e434b">nativeMessaging</text>

  <path d="M890 212 V200" fill="none" stroke="#141518" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <!-- notes -->
  <line x1="40" y1="326" x2="960" y2="326" stroke="#141518" stroke-width="2"/>
  <rect x="40" y="344" width="8" height="8" fill="#ff4d1c"/>
  <text x="56" y="353" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#141518">Direct</text>
  <text x="56" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6f76">dedicated profile / isolated spaces / cross-platform</text>

  <rect x="520" y="344" width="8" height="8" fill="#ff4d1c"/>
  <text x="536" y="353" font-family="Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#141518">Bridge</text>
  <text x="536" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b6f76">your signed-in browser / token-authenticated loopback / Windows installer</text>
</svg>
